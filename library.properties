sentence=Validated RC receiver mapping for Arduino with iBUS, ESP32 SBUS, shaping, filtering, and failsafe handling.
paragraph=RCLink maps receiver channels into named application roles with calibrated asymmetric axes, deterministic switches, explicit channel validity, link health, failsafe signatures, resilient stream parsers, optional JSON configuration, and an iBUS calibration helper. The core mapping and parsers are hardware-neutral and host-testable; SBUS transport is ESP32-specific.
category=Communication
