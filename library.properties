name=RCLink
version=1.1.0
author=Little Man Builds
maintainer=Little Man Builds <darren@ozzyimages.com>
sentence=Header-only ESP32 Arduino RC link with iBUS/SBUS transports, shaping/filters, JSON config, and easy failsafe/signature helpers.
paragraph=RCLink is a clean, dependency-light RC link for ESP32 Arduino. It includes robust iBUS and ESP32-only SBUS transports, per-channel mapping and shaping (deadband, expo, invert, EMA), epsilon suppression, receiver-failsafe signature detection, and a tiny ArduinoJson-based loader. New: RcMacros adds one-line failsafe signature macros and helper builders.
category=Communication
